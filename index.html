<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="80" height="400"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <div class="records-panel">
          <h3>Récords</h3>
          <div id="start-records"></div>
          <button id="start-reset-btn" class="reset-btn" type="button">Borrar récords</button>
        </div>
        <button id="play-btn">Jugar</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-stats" class="overlay-stats"></div>
        <div id="overlay-records-section" class="records-section hidden">
          <div class="save-score-form">
            <input type="text" id="player-name-input" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
            <button id="save-score-btn" type="button">Guardar</button>
          </div>
          <div class="records-panel">
            <h3>Récords</h3>
            <div id="overlay-records"></div>
            <button id="overlay-reset-btn" class="reset-btn" type="button">Borrar récords</button>
          </div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
